# piBrick Autorotation Configuration
#
# This file allows customization of the autorotation service without editing
# the main script. Copy to /etc/pibrick/autorotation.conf to apply changes.
#
# All settings are optional and have defaults.

# ── I2C Settings ───────────────────────────────────────────────────────────
# Override the I2C bus and address for the MMA8451Q accelerometer.
# Default: I2C1 (bus 1) at address 0x1C
# Uncomment to change:
# I2C_BUS=1
# I2C_ADDR=0x1C

# ── Fallback Mode ───────────────────────────────────────────────────────────
# Set to 1 to use userspace I2C instead of the kernel IIO driver.
# Useful if the mma8452 kernel driver is not available.
# Default: 0 (use kernel IIO driver)
# USE_I2C_FALLBACK=0

# ── Sensor Timing ───────────────────────────────────────────────────────────
# Delay before committing to a new orientation (milliseconds).
# Higher values reduce flicker from transient movements.
# Default: 50
# STABLE_DELAY_MS=50

# Minimum time between rotation commands (milliseconds).
# Default: 400
# ROTATION_COOLDOWN_MS=400

# ── Flat Detection ───────────────────────────────────────────────────────────
# |Z| above this value means the device is flat (ignore auto-rotate).
# Lower values make flat detection more sensitive.
# Default: 3500 (MMA8451Q 2g range)
# FLAT_Z_MAG=3500

# When flat, |X| and |Y| must both be below this for flat detection.
# Default: 2200
# FLAT_XY_MAX=2200

# ── Variance Filter ──────────────────────────────────────────────────────────
# Set to number of samples for variance filtering (1 = disabled).
# Default: 1 (disabled)
# VARIANCE_WINDOW=1

# Maximum allowed variance when filtering is enabled.
# Default: 5000
# VARIANCE_THRESHOLD=5000
