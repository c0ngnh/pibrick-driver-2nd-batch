# PocketCM5 / piBrick BQ25895 fuel-gauge tuning.
#
# These values are applied at module load (modprobe) on every boot.
# See README.md § "Battery driver customization" for what each knob does
# and how to change a value persistently with `battery_set.py`.
#
# IMPORTANT: do NOT add `persist_soc=N` here. The driver uses this only
# as a kernel-internal hint and it is also racey with udev-trigger.
# Persistent SOC across reboots is handled by
#   /var/lib/bq25890_battery/soc_persist
# and seeded at boot by pibrick-battery-load-soc.service, which writes
# the writable `coulomb_uah` sysfs attribute (race-free, no module
# reload needed).
#
# Notes for hardware WITHOUT the INA228 current sensor:
#   - The driver auto-bumps fg_v_ocv_tau_sec from 60 to 120 s.
#   - Run the auto-calibrator with --no-ina228 for 2-3 charge cycles.
#   - If you want a different tau anyway, set fg_v_ocv_tau_sec_override
#     below and the driver will use that instead.
options bq25890_battery discharge_current_ua=900000 charge_full_uah=3800000 batt_ir_mohm=180 discharge_max_ua=2200000 rest_min_sec=300
